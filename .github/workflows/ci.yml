name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # Runtime is stdlib-only; the [dev] extra pulls pytest + Pillow (for the
        # L3 hash pass). Installing the project itself also proves it builds;
        # tests/test_packaging.py then drives the installed `snapsift` command
        # from a fresh venv, since the rest of the suite imports from source.
        run: pip install ".[dev]"
      - name: Run tests
        run: pytest -q

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build SnapsiftCore
        run: swift build
        working-directory: app
      - name: Run Core tests
        run: swift run SnapsiftTests
        working-directory: app
